name: Daily marine reel

on:
  schedule:
    # 06:17 UTC daily. Off-the-hour on purpose: GitHub's free cron queue is
    # heavily oversubscribed at :00, and a stray minute is free insurance.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing (render the reel only)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state
          # Stable key, not github.run_id: the dedupe log is only useful if the
          # next run actually restores what the previous one wrote.
          key: swift-check-state-${{ github.run_number }}
          restore-keys: |
            swift-check-state-

      - name: Verify credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check:keys

      - name: Verify models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run check:models

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Scheduled runs and dispatches that leave dry_run on must never
          # publish. A single GitHub expression cannot express this safely
          # (null == false coerces to true), so decide it in the shell.
          ARGS="--dry"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS=""
          fi
          echo "orchestrator args: '$ARGS'"
          node server/orchestrator.js $ARGS

      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: warn

      # Feeds the read-only dashboard on Vercel. The reel is already rendered and
      # published by this point, so a Blob outage must not fail the job — the
      # dashboard just goes stale until the next run, which is recoverable, while
      # a red X on the reel job is not.
      - name: Publish dashboard data
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run publish:dashboard

      - name: Commit dedupe log
        if: always()
        run: |
          # state/ is the dedupe log the next run restores. client/public/data is
          # the published dashboard feed — committing it is what triggers the
          # Vercel rebuild that makes the new reel visible.
          git config user.name  "swift-check-ai"
          git config user.email "actions@github.com"
          # git add on a pathspec that matches nothing exits 128, which would fail
          # this step — and with it the job — on exactly the Blob outage the
          # publish step above is allowed to survive. The directories must exist.
          mkdir -p state client/public/data
          git add state client/public/data
          git diff --staged --quiet || git commit -m "chore: reel state $(date -u +%Y-%m-%d)"
          git push
