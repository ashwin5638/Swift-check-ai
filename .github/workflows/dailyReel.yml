
name: Daily marine reel

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing (render the reel only)'
        type: boolean
        default: true
      skip_render:
        description: 'Stop before rendering — no frames, no audio, no mp4'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: swift-check-ai
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state
          key: swift-check-state-${{ github.run_number }}
          restore-keys: |
            swift-check-state-

      - name: Verify credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check:keys

      - name: Check dashboard credential
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is not set — the dashboard feed will publish with no reels until it is."
            exit 1
          fi

      - name: Verify models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run check:models

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_RENDER: ${{ inputs.skip_render }}
        run: |
          ARGS="--dry"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS=""
          fi
          if [ "$SKIP_RENDER" = "true" ]; then
            ARGS="$ARGS --no-render"
          fi
          echo "orchestrator args: '$ARGS'"
          node server/orchestrator.js $ARGS

      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: warn

      - name: Publish dashboard data
        if: always()
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run publish:dashboard

      - name: Commit dashboard feed
        if: always()
        run: |
          git config user.name "swift-check-ai"
          git config user.email "actions@github.com"
          mkdir -p client/public/data
          git add client/public/data
          if ! git diff --staged --quiet; then
            git commit -m "chore: dashboard feed $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi